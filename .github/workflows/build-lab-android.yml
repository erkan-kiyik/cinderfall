name: Build Cinderfall LAB Android APK

# The LAB build packages public/game2 — the testbed copy of the game — as a
# separate app (its own application id and name), so it installs next to the
# shipping game on the same phone instead of replacing it.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "public/game2/**"
      - ".github/workflows/build-lab-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_DIR: game2
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use the runner's Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Own application id and name, so this installs beside the shipping app.
      - name: Give the LAB build its own app id
        run: |
          node -e "
            const fs = require('fs');
            const p = 'capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.appId = 'com.cinderfall.sector9.lab';
            c.appName = 'CF LAB';
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      - name: Install mobile dependencies
        run: npm install

      - name: Scaffold Android shell from web assets
        run: npm run add:android

      - name: Generate app icons + splash screens
        run: npm run assets

      - name: Raise Android target to API 36
        run: node ./scripts/patch-android-sdk.mjs

      - name: Patch Android theme (dark, edge-to-edge)
        run: node ./scripts/patch-android-theme.mjs

      - name: Patch Android manifest (AdMob test App ID)
        run: node ./scripts/patch-android-admob.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish a LAB release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab-build-${{ github.run_number }}
          name: "Cinderfall LAB build #${{ github.run_number }}"
          body: |
            LAB build (public/game2) from commit ${{ github.sha }}.
            Installs as a separate app ("CF LAB", com.cinderfall.sector9.lab)
            next to the shipping game. Debug-key signed, for testing only.
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
