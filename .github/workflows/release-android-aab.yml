name: Build Android release AAB

# Separate from build-android.yml on purpose: that one runs on
# every push and produces a debug-signed APK for quick device testing. This
# one produces a release .aab — the format Play Console requires.
#
# Signing is OPTIONAL and entirely secret-driven, never required to get a
# build out of this workflow:
#   ANDROID_KEYSTORE_BASE64  the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASS    its store password
#   ANDROID_KEY_PASS         its key password (PKCS12: same as the store password)
# (Settings -> Secrets and variables -> Actions -> New repository secret;
# documented in docs/RELEASE.md.) If all three are set, the bundle is signed
# on the runner and is ready for direct Play Console upload. If they are not
# set, Gradle still produces a perfectly valid .aab — just unsigned — which
# can be signed afterward, by anyone holding the keystore, with:
#   jarsigner -keystore cinderfall-upload.keystore app-release.aab cinderfall
# (`jarsigner` ships with any JDK; no Android SDK needed for that step.) The
# keystore itself is never generated, logged, committed, or uploaded here.
#
# Since KOR (docs/RELEASE.md §5a) an unsigned bundle is no longer the quiet
# default: run 12-15 all came out unsigned without anyone noticing. The run now
# fails when the secrets are missing, unless `allow_unsigned` is ticked for a
# test build, and a signed run prints the upload certificate's fingerprint so
# it can be checked against Play Console before uploading.
on:
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: "Build even without the signing secrets (the bundle cannot be uploaded to Play)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The hosted runner ships the Android SDK; android-actions/setup-android
      # started failing once runners forced its Node 20 code onto Node 24.
      - name: Use the runner's Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install mobile dependencies
        run: npm install

      - name: Scaffold Android shell from web assets
        run: npm run add:android

      # Same three regenerate-every-run patches build-android.yml
      # applies — see that workflow's comment for why they're needed at all
      # (dark theme, real app icon, AdMob manifest entry). A release build
      # with the debug theme or a missing manifest entry would be a broken
      # listing, not just a rough edge, so this path can't skip them either.
      - name: Generate app icons + splash screens
        run: npm run assets

      # Play requires targeting API 36; the Capacitor 6 template is on 34.
      - name: Raise Android target to API 36
        run: node ./scripts/patch-android-sdk.mjs

      - name: Patch Android theme (dark, edge-to-edge)
        run: node ./scripts/patch-android-theme.mjs

      - name: Patch Android manifest (AdMob App ID)
        run: node ./scripts/patch-android-admob.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      # Play Console rejects a bundle whose versionCode it has seen before, and
      # the Capacitor template always ships versionCode 1 — so every bundle
      # after the first would bounce. Derive it from the run number instead:
      # strictly increasing, never reused.
      - name: Set versionCode / versionName
        working-directory: mobile/android/app
        run: |
          CODE=$(( ${{ github.run_number }} + 1 ))
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/; s/versionName \"[^\"]*\"/versionName \"2.0.${CODE}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      # Both of the next two steps are conditional on the signing secrets
      # actually being set. Neither failing nor silently no-op'ing when only
      # one of the three is present — that would sign with a wrong/missing
      # password and produce a corrupt bundle — so this checks all three
      # together and skips CI-side signing as a group if any is absent.
      - name: Check whether signing secrets are configured
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASS }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.allow_unsigned }}" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets configured — building an UNSIGNED .aab, as asked. It cannot be uploaded to Play Console as it is."
          else
            echo "::error::The signing secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS and ANDROID_KEY_PASS are not all set. Set them (docs/RELEASE.md §5a: lost upload key) or run again with allow_unsigned for a test build."
            exit 1
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # Written directly into app/build.gradle rather than committed as a
      # signingConfig — this repo never carries real signing material, only
      # the recipe for the runner to assemble it from secrets on demand.
      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile/android/app
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          python3 - "$KEYSTORE_PASS" "$KEY_PASS" <<'PY'
          import re, sys
          store_pass, key_pass = sys.argv[1], sys.argv[2]
          p = 'build.gradle'
          src = open(p, encoding='utf-8').read()
          signing = f"""
              signingConfigs {{
                  release {{
                      storeFile file('release.keystore')
                      storePassword {store_pass!r}
                      keyAlias 'cinderfall'
                      keyPassword {key_pass!r}
                  }}
              }}
          """
          src = re.sub(r'(android\s*\{)', r'\1' + signing, src, count=1)
          src = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              src, count=1,
          )
          open(p, 'w', encoding='utf-8').write(src)
          PY

      - name: Build release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon

      # The certificate the bundle is signed with: its SHA-256 must equal
      # Play Console > App integrity > App signing > "Upload key certificate".
      - name: Show the upload certificate fingerprint
        if: steps.signing.outputs.enabled == 'true'
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E 'Owner:|SHA1:|SHA256:' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f mobile/android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: kor-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish a release with the AAB attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-aab-${{ github.run_number }}
          name: "KOR release AAB #${{ github.run_number }}"
          body: |
            Android App Bundle, built from commit ${{ github.sha }} — versionCode ${{ github.run_number }} + 1.

            ${{ steps.signing.outputs.enabled == 'true' && 'Signed with the upload keystore in ANDROID_KEYSTORE_BASE64 — ready for direct upload to Play Console. Enroll in Play App Signing on first upload so Google re-signs the app for distribution while this stays your upload key.' || 'UNSIGNED — the signing secrets were not set for this run. Sign before uploading to Play Console: jarsigner -keystore cinderfall-upload.keystore app-release.aab cinderfall (see docs/RELEASE.md).' }}
          files: mobile/android/app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
