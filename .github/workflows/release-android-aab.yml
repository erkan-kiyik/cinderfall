name: Build signed Android release AAB

# Separate from build-cinderfall-android.yml on purpose: that one runs on
# every push and produces a debug-signed APK for quick device testing. This
# one produces a release-signed .aab — the format Play Console requires — and
# only runs on request, because it touches signing secrets and there is no
# reason to spend that on every commit.
#
# Requires three repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret), documented in docs/RELEASE.md:
#   ANDROID_KEYSTORE_BASE64  the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASS    its store password
#   ANDROID_KEY_PASS         its key password (PKCS12: same as the store password)
#
# The keystore is written to a runner-local temp file for the duration of the
# build and never committed, logged, or uploaded as an artifact — only the
# signed .aab it produces is.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install mobile dependencies
        run: npm install

      - name: Scaffold Android shell from web assets
        run: npm run add:android

      # Same three regenerate-every-run patches build-cinderfall-android.yml
      # applies — see that workflow's comment for why they're needed at all
      # (dark theme, real app icon, AdMob manifest entry). A release build
      # with the debug theme or a missing manifest entry would be a broken
      # listing, not just a rough edge, so this path can't skip them either.
      - name: Generate app icons + splash screens
        run: npm run assets

      - name: Patch Android theme (dark, edge-to-edge)
        run: node ./scripts/patch-android-theme.mjs

      - name: Patch Android manifest (AdMob App ID)
        run: node ./scripts/patch-android-admob.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/RELEASE.md." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # Written directly into app/build.gradle rather than committed as a
      # signingConfig — this repo never carries real signing material, only
      # the recipe for the runner to assemble it from secrets on demand.
      - name: Configure release signing
        working-directory: mobile/android/app
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::ANDROID_KEYSTORE_PASS / ANDROID_KEY_PASS secrets are not set. See docs/RELEASE.md." >&2
            exit 1
          fi
          python3 - "$KEYSTORE_PASS" "$KEY_PASS" <<'PY'
          import re, sys
          store_pass, key_pass = sys.argv[1], sys.argv[2]
          p = 'build.gradle'
          src = open(p, encoding='utf-8').read()
          signing = f"""
              signingConfigs {{
                  release {{
                      storeFile file('release.keystore')
                      storePassword {store_pass!r}
                      keyAlias 'cinderfall'
                      keyPassword {key_pass!r}
                  }}
              }}
          """
          src = re.sub(r'(android\s*\{)', r'\1' + signing, src, count=1)
          src = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              src, count=1,
          )
          open(p, 'w', encoding='utf-8').write(src)
          PY

      - name: Build release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f mobile/android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: cinderfall-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish a release with the AAB attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-aab-${{ github.run_number }}
          name: "Cinderfall release AAB #${{ github.run_number }}"
          body: |
            Signed release Android App Bundle, built from commit ${{ github.sha }}.

            Signed with the upload keystore in ANDROID_KEYSTORE_BASE64 — ready
            for direct upload to Play Console. Enroll in Play App Signing on
            first upload so Google re-signs the app for distribution while
            this stays your upload key.
          files: mobile/android/app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
