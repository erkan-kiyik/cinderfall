name: Build Android release AAB

# Separate from build-cinderfall-android.yml on purpose: that one runs on
# every push and produces a debug-signed APK for quick device testing. This
# one produces a release .aab — the format Play Console requires.
#
# Signing is OPTIONAL and entirely secret-driven, never required to get a
# build out of this workflow:
#   ANDROID_KEYSTORE_BASE64  the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASS    its store password
#   ANDROID_KEY_PASS         its key password (PKCS12: same as the store password)
# (Settings -> Secrets and variables -> Actions -> New repository secret;
# documented in docs/RELEASE.md.) If all three are set, the bundle is signed
# on the runner and is ready for direct Play Console upload. If they are not
# set, Gradle still produces a perfectly valid .aab — just unsigned — which
# can be signed afterward, by anyone holding the keystore, with:
#   jarsigner -keystore cinderfall-upload.keystore app-release.aab cinderfall
# (`jarsigner` ships with any JDK; no Android SDK needed for that step.) The
# keystore itself is never generated, logged, committed, or uploaded here.
#
# Ads are secret-driven too:
#   ADMOB_ANDROID_APP_ID       your AdMob app id      (ca-app-pub-…~…)
#   ADMOB_ANDROID_REWARDED_ID  your rewarded ad unit  (ca-app-pub-…/…)
# Without them the bundle carries Google's TEST ids, which serve test ads and
# earn nothing. That is fine for an unsigned bundle, and refused for a signed
# one: a store-ready .aab can never ship test ads (see mobile/scripts/
# admob-ids.mjs).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      ADMOB_ANDROID_REWARDED_ID: ${{ secrets.ADMOB_ANDROID_REWARDED_ID }}
    steps:
      - uses: actions/checkout@v4

      # Decided first, because it changes what every later step may produce.
      # Secrets are read through env, never pasted into the script: a password
      # containing a quote, a backtick or $( would otherwise break the step or
      # run as a command. All three signing secrets or none — one or two of
      # them would sign with a wrong or missing password and produce a corrupt
      # bundle — and a signed bundle turns on the AdMob test-id guard for every
      # step after this one.
      - name: Check whether signing secrets are configured
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "CINDERFALL_STORE_BUILD=android" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets configured — building an UNSIGNED .aab. See docs/RELEASE.md to sign in CI, or sign the downloaded bundle yourself with jarsigner."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The action's default package list includes the legacy 'tools'
      # package, which the SDK repository behind cmdline-tools 16 no longer
      # carries: sdkmanager exits 1 on it and the job dies in setup. Only
      # platform-tools is needed here; the next step adds the platform and
      # build-tools the build uses.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install mobile dependencies
        run: npm install

      - name: Scaffold Android shell from web assets
        run: npm run add:android

      # Same three regenerate-every-run patches build-cinderfall-android.yml
      # applies — see that workflow's comment for why they're needed at all
      # (dark theme, real app icon, AdMob manifest entry). A release build
      # with the debug theme or a missing manifest entry would be a broken
      # listing, not just a rough edge, so this path can't skip them either.
      - name: Generate app icons + splash screens
        run: npm run assets

      - name: Patch Android theme (dark, edge-to-edge)
        run: node ./scripts/patch-android-theme.mjs

      - name: Patch Android manifest (AdMob App ID, landscape)
        run: node ./scripts/patch-android-manifest.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # The signing config reads both passwords from the environment at build
      # time, so neither is ever written into a file. (It used to splice them
      # into build.gradle as Python-quoted literals, which Groovy interpolated
      # or mis-escaped for a password containing $, a quote or a backslash.)
      - name: Configure release signing
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile/android/app
        run: |
          python3 - <<'PY'
          import re
          p = 'build.gradle'
          src = open(p, encoding='utf-8').read()
          signing = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASS')
                      keyAlias 'cinderfall'
                      keyPassword System.getenv('ANDROID_KEY_PASS')
                  }
              }
          """
          src = re.sub(r'(android\s*\{)', lambda m: m.group(1) + signing, src, count=1)
          src = re.sub(
              r'(buildTypes\s*\{\s*release\s*\{)',
              lambda m: m.group(1) + '\n            signingConfig signingConfigs.release',
              src, count=1,
          )
          open(p, 'w', encoding='utf-8').write(src)
          PY

      - name: Build release AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f mobile/android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: cinderfall-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish a release with the AAB attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-aab-${{ github.run_number }}
          name: "Cinderfall release AAB #${{ github.run_number }}"
          body: |
            Android App Bundle, built from commit ${{ github.sha }}.

            ${{ steps.signing.outputs.enabled == 'true' && 'Signed with the upload keystore in ANDROID_KEYSTORE_BASE64 — ready for direct upload to Play Console. Enroll in Play App Signing on first upload so Google re-signs the app for distribution while this stays your upload key.' || 'UNSIGNED — the signing secrets were not set for this run. Sign before uploading to Play Console: jarsigner -keystore cinderfall-upload.keystore app-release.aab cinderfall (see docs/RELEASE.md).' }}
          files: mobile/android/app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
