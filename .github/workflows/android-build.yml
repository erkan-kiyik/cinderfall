name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'public/game/**'
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mobile wrapper deps (syncs game into www)
        working-directory: mobile
        run: npm install

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Generate app icons + splash screens
        working-directory: mobile
        run: npm run assets

      - name: Patch Android theme (dark, edge-to-edge)
        working-directory: mobile
        run: node ./scripts/patch-android-theme.mjs

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinderfall-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: CINDERFALL Android build #${{ github.run_number }}
          body: |
            Automated debug-signed Android build from commit ${{ github.sha }}.

            This APK is signed with the Android **debug key** — install it directly
            on a device for testing (enable "install unknown apps" for your file
            manager/browser). It is **not** suitable for Play Store submission;
            that requires a release keystore and Play App Signing enrollment,
            which only the account holder can set up (see docs/RELEASE.md).
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
